# Template: a rulebook for a personal care robot in a home or care setting,
# shaped after ISO 13482:2014.
#
# This file carries no values. ISO standards are copyrighted, and a robot's
# limits come from its risk assessment and a licensed copy of the standard,
# not from this repository. Every FILL_IN is deliberately invalid: a
# validator refuses to load this file (rule.rulebook_invalid) until each one
# is replaced, so an unfilled template never runs.
#
# Scope: ISO 13482 names three kinds of personal care robot. This template is
# for the mobile servant robot, the kind the home profile describes: it
# travels, fetches and hands things over. Physical assistant robots (worn or
# held by the person they help) and person carriers need rules this format
# does not express.
#
# How to use it:
#   1. Copy the file. Give it your own rulebook_id, title, issuer and
#      reviewed date.
#   2. Fill each value from the robot's risk assessment and your licensed
#      copy of the standard. Write the clause you used into the cite.
#   3. Declare every named zone in the robot manifest's declared_areas, drawn
#      for the actual home or facility.
#   4. Keep the safety functions in safety-rated hardware and software. A
#      rulebook refuses a program before it runs; it does not stop a robot
#      that is already moving or yield to a person it touches.
#
# Edition checked on 2026-11-24 against the ISO catalogue: ISO 13482:2014
# (Robots and robotic devices, Safety requirements for personal care robots),
# last confirmed in 2020 and marked by ISO as to be revised. A revision is in
# development under the working title "Safety requirements for service
# robots"; on 2026-11-25 ISO listed it at stage 60.00, under publication,
# not yet published. When it is published, check every cite against it.
#
# An ISO standard is not law, so the maker, integrator or care provider who
# adopts one writes it as an organization rulebook. The rules below are the
# statically checkable part; the obligations are what URML lists and cannot
# check.
#
# Draft: the format is specified in spec/layer-1-hal/rulebook.md (RFC-0702).

rulebook_version: "0.1"
rulebook_id: FILL_IN
title: "FILL_IN (for example: Home helper rules, from the 2026 risk assessment)"
issuer:
  kind: organization
  name: "FILL_IN (the robot maker, the integrator or the care provider)"
source_status: organization_policy
reviewed: FILL_IN
description: >-
  Operating rules for a mobile servant robot that works near people, taken
  from the robot's risk assessment and ISO 13482:2014. Every value comes from
  a licensed copy of the standard named in its cite.

rules:
  - id: max_travel_speed
    title: Maximum travel speed a program may request
    cite:
      text: "ISO 13482:2014, clause FILL_IN; the robot's risk assessment"
      standard: "ISO 13482:2014"
    note: >-
      The highest speed the risk assessment allows where the robot shares
      space with people. A global cap: v0.1 has no zone-scoped caps. Speed
      and separation near a person stay in the robot's safety-rated control.
    cap:
      quantity: speed_m_per_s
      max: FILL_IN

  - id: max_grip_force
    title: Maximum gripper force where a person can be touched
    cite:
      text: "ISO 13482:2014, clause FILL_IN; the robot's risk assessment"
      standard: "ISO 13482:2014"
    note: >-
      Covers fetching and handing an object to a person. URML compares the
      force a program requests; limiting the force during contact stays in
      the robot's safety-rated control. The home envelope's max_grip_force_n
      also applies, and the stricter limit wins.
    cap:
      quantity: grip_force_n
      max: FILL_IN

  - id: hazard_zones
    title: Programs never send the robot into a hazard zone
    cite:
      text: "ISO 13482:2014, clause FILL_IN; the robot's risk assessment"
      standard: "ISO 13482:2014"
    note: >-
      Name the places the risk assessment keeps the robot out of, such as the
      top of a stairway, a balcony or a pool area, and declare them in the
      manifest's declared_areas.
    forbid_zone_entry:
      zones: [FILL_IN]

  - id: no_handling_in_zones
    title: No grasping or releasing in zones the risk assessment excludes
    cite:
      text: "ISO 13482:2014, clause FILL_IN; the robot's risk assessment"
      standard: "ISO 13482:2014"
    note: >-
      Name the areas where the robot must not pick up or put down objects,
      such as next to a cooktop or beside a bed. pick_from and place_at count
      as grasp and release.
    forbid_primitive:
      primitives: [grasp, release]
      in_zones: [FILL_IN]

  - id: validated_programs_only
    title: Only robot programs covered by the risk assessment run
    cite:
      text: "ISO 13482:2014, clause FILL_IN; the robot's risk assessment"
      standard: "ISO 13482:2014"
    note: >-
      call_program is opaque to URML. List the built-in programs the risk
      assessment covered.
    forbid_primitive:
      primitives: [call_program]
      except_names: [FILL_IN]

obligations:
  - id: risk_assessment
    title: A current risk assessment for the robot in its setting
    text: >-
      The robot has a risk assessment that covers the people it works near,
      including children, older people and anyone with limited mobility, and
      every task these programs perform. It is repeated when the setting or
      the tasks change.
    cite:
      text: "ISO 13482:2014, clause FILL_IN"
      standard: "ISO 13482:2014"

  - id: safety_rated_functions
    title: Stopping, speed and force limits in safety-rated control
    text: >-
      Protective stop, emergency stop, and the limits on speed and contact
      force near people run in safety-rated hardware and software, at the
      performance levels the standard requires, not in URML.
    cite:
      text: "ISO 13482:2014, clauses FILL_IN"
      standard: "ISO 13482:2014"

  - id: environment_checked
    title: The setting is checked for the robot's travel
    text: >-
      Floors, thresholds, slopes, stairs and obstacles in the home or facility
      are checked against the robot's stability and travel limits, and the
      declared_areas in its manifest match the hazards found.
    cite:
      text: "ISO 13482:2014, clause FILL_IN"
      standard: "ISO 13482:2014"

  - id: users_informed
    title: The people the robot serves are informed and instructed
    text: >-
      The people who live or work with the robot, and their carers, receive
      the information for use, including how to stop the robot and what it
      must not be asked to do.
    cite:
      text: "ISO 13482:2014, clause FILL_IN"
      standard: "ISO 13482:2014"
