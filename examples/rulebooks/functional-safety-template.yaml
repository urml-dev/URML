# Template: a rulebook that keeps programs from running until the site has
# declared its safety functions, shaped after ISO 13849-1:2023 /
# ISO 13849-2, IEC 62061:2021 and IEC 61508:2010, with the robot's drive
# safety functions after IEC 61800-5-2:2016.
#
# Read this first. URML is not a safety-related part of a control system.
# The validator is not safety-rated, a refusal is not a safety function, and
# nothing in URML counts toward a performance level (PL, ISO 13849) or a
# safety integrity level (SIL, IEC 62061 and IEC 61508). These standards
# apply to the robot's own safety-related control: its emergency stop,
# protective stop, speed and separation monitoring, power and force
# limiting. Those are designed, built and validated outside URML.
#
# What this rulebook does is narrower and still useful: it refuses programs
# until the operator has put on record, in a deployment rulebook, the level
# each safety function reached, and that level meets what the risk
# assessment requires. URML checks that the declaration exists and is high
# enough. It does not check that the declaration is true.
#
# One key per safety function takes any of these levels, because a machine
# is designed to one standard or another, and sometimes to more than one:
#   ISO 13849-1:  PLa, PLb, PLc, PLd, PLe
#   IEC 62061:    SIL1, SIL2, SIL3
#   IEC 61508:    SIL1, SIL2, SIL3, SIL4
#
# IEC 61508 is the basic functional-safety standard that IEC 62061 applies
# to machinery. It is the one to use for a robot outside the machinery
# standards, and the one the makers of safety components (safety
# controllers, drives with a safe torque off, safety-rated sensors) design
# to. A SIL means the same thing under both, so the same SIL1..SIL3 values
# serve either. IEC 62061 stops at SIL3; IEC 61508 also defines SIL4.
#
# IEC 61800-5-2 is the functional-safety standard for the robot's drives. It
# names the safety functions a drive can carry out itself, among them safe
# torque off (STO), safe stop 1 and safe stop 2 (SS1, SS2), and safely
# limited speed (SLS). STO, SS1 and SS2 match stop categories 0, 1 and 2 of
# IEC 60204-1. The last three rules use it: the stop function the drives perform
# is on record, a speed cap keeps programs below the drives' SLS limit, and
# programs never write the inputs that request a drive safety function. The
# cap is a convenience, not protection: a program that asked for more would
# only trip the drive. The SLS in the drive is the safety function. Delete
# the three rules if the robot's drives have no safety functions.
#
# This file carries no values. ISO and IEC standards are copyrighted, and the
# level each function requires (PLr, or the required SIL) comes from the
# machine's risk assessment and a licensed copy of the standard, not from
# this repository. Every FILL_IN is deliberately invalid: a validator
# refuses to load this file (rule.rulebook_invalid) until each one is
# replaced, so an unfilled template never runs.
#
# How to use it:
#   1. Copy the file. Give it your own rulebook_id, title, issuer and
#      reviewed date. Delete the rules for safety functions the machine does
#      not have.
#   2. For each rule, list in `allowed` the levels that meet the function's
#      requirement, in the vocabulary of the standard the machine was
#      designed to: for a PLr of d, [PLd, PLe]; for a required SIL 2 under
#      IEC 62061, [SIL2, SIL3]; under IEC 61508, [SIL2, SIL3, SIL4]. List
#      PLs and SILs together only if the integrator has established which
#      levels of one satisfy the other for this machine.
#   3. Have the operator file a deployment rulebook that declares each key,
#      from the integrator's validation records, for example:
#
#        rulebook_version: "0.1"
#        rulebook_id: cell_7_safety_declarations
#        title: Cell 7 safety function declarations
#        issuer: {kind: deployment, name: Example Integrator}
#        source_status: deployment_declaration
#        declarations:
#          emergency_stop_safety_level: PLd
#          protective_stop_safety_level: SIL2
#          speed_monitoring_safety_level: PLd
#          safety_validation_record: "VAL-2026-017"
#
#   4. Load both with --rulebook. With the deployment rulebook loaded, a
#      missing or insufficient declaration refuses every program
#      (rule.declaration_missing). With no deployment rulebook loaded, the
#      same finding is a warning, as the rulebook format specifies.
#
# Editions checked on 2026-11-24:
#   - ISO 13849-1:2023 (Safety of machinery, Safety-related parts of control
#     systems, Part 1: General principles for design), fourth edition,
#     published 2023-04. ISO 13849-2 (Part 2: Validation) was last
#     published in 2012; check the ISO catalogue for a newer edition.
#   - IEC 62061:2021 (Safety of machinery, Functional safety of
#     safety-related control systems), edition 2.0, published 2021-03, with
#     Amendment 1:2024; the consolidated edition 2.1 is dated 2024-03-28.
#   - IEC 61508:2010 (Functional safety of electrical/electronic/
#     programmable electronic safety-related systems), parts 1 to 7,
#     edition 2.0; part 1 is dated 2010-04-30. Edition 3 is at the final
#     draft stage, forecast for publication in 2027. Check the cites when it
#     is out.
#   - IEC 61800-5-2:2016 (Adjustable speed electrical power drive systems,
#     Part 5-2: Safety requirements, Functional), edition 2.0, checked on
#     2026-11-25 on the IEC webstore. UL 61800-5-2 is the US version; check
#     its edition.
#
# Draft: the format is specified in spec/layer-1-hal/rulebook.md (RFC-0702).

rulebook_version: "0.1"
rulebook_id: FILL_IN
title: "FILL_IN (for example: Cell 7 safety functions on record before any program runs)"
issuer:
  kind: organization
  name: "FILL_IN (the integrator or the site operator)"
source_status: organization_policy
reviewed: FILL_IN
description: >-
  Programs run only after the operator has declared, from the integrator's
  validation records, the performance level or safety integrity level each
  safety function reached. URML checks the declaration, not the safety
  function.

rules:
  - id: emergency_stop_declared
    title: The emergency stop's safety level is declared and meets its requirement
    cite:
      text: "ISO 13849-1:2023, IEC 62061:2021 or IEC 61508:2010, clause FILL_IN; the machine's risk assessment"
      standard: ["ISO 13849-1:2023", "IEC 62061:2021", "IEC 61508:2010"]
    note: >-
      List the levels that meet the emergency stop's required level from the
      risk assessment.
    require_declared:
      key: emergency_stop_safety_level
      allowed: [FILL_IN]

  - id: protective_stop_declared
    title: The protective stop's safety level is declared and meets its requirement
    cite:
      text: "ISO 13849-1:2023, IEC 62061:2021 or IEC 61508:2010, clause FILL_IN; the machine's risk assessment"
      standard: ["ISO 13849-1:2023", "IEC 62061:2021", "IEC 61508:2010"]
    note: >-
      The stop triggered by safeguards such as scanners, light curtains and
      interlocked doors.
    require_declared:
      key: protective_stop_safety_level
      allowed: [FILL_IN]

  - id: speed_monitoring_declared
    title: Safety-rated speed monitoring is declared and meets its requirement
    cite:
      text: "ISO 13849-1:2023, IEC 62061:2021 or IEC 61508:2010, clause FILL_IN; the machine's risk assessment"
      standard: ["ISO 13849-1:2023", "IEC 62061:2021", "IEC 61508:2010"]
    note: >-
      For machines that rely on safety-rated speed or separation monitoring
      near people. Delete this rule if the machine has no such function.
    require_declared:
      key: speed_monitoring_safety_level
      allowed: [FILL_IN]

  - id: safety_validation_on_record
    title: The safety functions' validation is on record
    cite:
      text: "ISO 13849-2, IEC 62061:2021 or IEC 61508:2010, clause FILL_IN"
      standard: ["ISO 13849-2", "IEC 62061:2021", "IEC 61508:2010"]
    note: >-
      The declared value is the reference of the integrator's validation
      record, so a reader can find it. Any value satisfies the rule.
    require_declared:
      key: safety_validation_record

  - id: drive_stop_function_declared
    title: The stop function the robot's drives perform is declared and accepted
    cite:
      text: "IEC 61800-5-2:2016, clause FILL_IN; the drive's safety manual"
      standard: "IEC 61800-5-2:2016"
    note: >-
      The drive safety function the emergency and protective stops use, as
      the drive's safety manual names it. List the ones the risk assessment
      accepts, for example STO or SS1.
    require_declared:
      key: drive_stop_function
      allowed: [FILL_IN]

  - id: below_safely_limited_speed
    title: Programs stay below the drives' safely limited speed
    cite:
      text: "IEC 61800-5-2:2016, clause FILL_IN; the drive's SLS configuration"
      standard: "IEC 61800-5-2:2016"
    note: >-
      Set this below the speed the drives' SLS function allows, converted
      from the drive's axis speed to the speed a program commands, with a
      margin, so no program asks for a speed the drive would stop on. URML
      compares the speed a program requests; the drive enforces SLS.
    cap:
      quantity: speed_m_per_s
      max: FILL_IN

  - id: drive_safety_inputs_untouched
    title: Programs never write the inputs that request a drive safety function
    cite:
      text: "IEC 61800-5-2:2016, clause FILL_IN; the drive's safety manual"
      standard: "IEC 61800-5-2:2016"
    note: >-
      Name the output lines wired to the drives' safety inputs, such as an STO
      or SS1 request.
    forbid_primitive:
      primitives: [set_output]
      names: [FILL_IN]

obligations:
  - id: urml_is_not_a_safety_function
    title: Nothing in URML counts toward a performance level or a SIL
    text: >-
      The URML validator and runtimes are not safety-related parts of the
      control system. They are left out of every performance level and
      safety integrity level calculation, and no safety function depends on
      them.
    cite:
      text: "ISO 13849-1:2023, IEC 62061:2021 or IEC 61508:2010, clause FILL_IN"
      standard: ["ISO 13849-1:2023", "IEC 62061:2021", "IEC 61508:2010"]

  - id: urml_cannot_interfere
    title: URML cannot interfere with safety-related software
    text: >-
      If URML runs on hardware that also runs safety-related software, the
      integrator shows that URML cannot interfere with it, or treats URML as
      safety-related, which URML does not support. The simpler design keeps
      URML on separate hardware.
    cite:
      text: "IEC 61508-3:2010, clause FILL_IN"
      standard: "IEC 61508-3:2010"

  - id: safety_functions_designed
    title: Each safety function is designed to its required level
    text: >-
      Each safety function the risk assessment calls for is specified,
      designed and implemented in safety-related control to reach its
      required performance level or safety integrity level.
    cite:
      text: "ISO 13849-1:2023, IEC 62061:2021 or IEC 61508:2010, clauses FILL_IN"
      standard: ["ISO 13849-1:2023", "IEC 62061:2021", "IEC 61508:2010"]

  - id: safety_functions_validated
    title: Each safety function is validated
    text: >-
      The safety functions are validated before use, and again after any
      change to the safety-related control, and the validation record is
      kept.
    cite:
      text: "ISO 13849-2, IEC 62061:2021 or IEC 61508:2010, clauses FILL_IN"
      standard: ["ISO 13849-2", "IEC 62061:2021", "IEC 61508:2010"]

  - id: declarations_kept_true
    title: The declarations match the validation records
    text: >-
      The operator keeps the deployment rulebook's declarations in line with
      the current validation records, and updates them when the safety
      functions or their validation change.
    cite:
      text: "ISO 13849-2, IEC 62061:2021 or IEC 61508:2010, clause FILL_IN; the site's own procedures"
      standard: ["ISO 13849-2", "IEC 62061:2021", "IEC 61508:2010"]

  - id: drive_safety_functions_validated
    title: The drives' safety functions are configured, protected and validated
    text: >-
      The drives' safety functions and their parameters, such as the SLS
      limit, are set as the drive's safety manual requires, protected against
      change, and validated in the installed machine. URML never writes a
      drive safety parameter.
    cite:
      text: "IEC 61800-5-2:2016, clauses FILL_IN; the drive's safety manual"
      standard: "IEC 61800-5-2:2016"

  - id: speed_cap_follows_the_drive
    title: The speed cap is rechecked when the drive's limits change
    text: >-
      When the SLS limit, the gearing or the kinematics change, the speed cap
      in this rulebook is recalculated so it stays below the new limit.
    cite:
      text: "IEC 61800-5-2:2016, clause FILL_IN; the site's own procedures"
      standard: "IEC 61800-5-2:2016"
