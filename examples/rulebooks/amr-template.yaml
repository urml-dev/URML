# Template: an integrator's rulebook for industrial mobile robots (AMRs and
# AGVs) at one site, shaped after ISO 3691-4:2023 and the ANSI/A3 R15.08
# series.
#
# This file carries no values. ISO and ANSI standards are copyrighted, and a
# site's limits come from its risk assessment and the integrator's licensed
# copy of each standard, not from this repository. Every FILL_IN is
# deliberately invalid: a validator refuses to load this file
# (rule.rulebook_invalid) until each one is replaced, so an unfilled template
# never runs.
#
# How to use it:
#   1. Copy the file. Give it your own rulebook_id, title, issuer and
#      reviewed date.
#   2. Fill each value from your risk assessment and your licensed copy of the
#      standard its cite names. Write the clause you used into the cite.
#   3. Declare every named zone in the robot manifest's declared_areas, drawn
#      to match the zones marked on the site floor.
#   4. Keep the safety functions in safety-rated hardware and software. A
#      rulebook refuses a program before it runs; it does not stop or slow a
#      robot that is already moving, and a fleet manager's traffic rules are
#      not safety functions either.
#
# Editions checked on 2026-11-24 against the ISO catalogue and ANSI's
# listings: ISO 3691-4:2023 (Industrial trucks, Safety requirements and
# verification, Part 4: Driverless industrial trucks and their systems),
# edition 2, published 2023-06, which replaced ISO 3691-4:2020; ANSI/A3
# R15.08-1-2020 (R2026) (Industrial mobile robots, Safety requirements, Part 1:
# the robot), reaffirmed in 2026 without technical change; ANSI/A3
# R15.08-2-2023 (Part 2: the system and its integration); and ANSI/A3
# R15.08-3-2026 (Part 3: use). Check which editions your contract names; a
# site may follow ISO 3691-4, R15.08, or both.
#
# A voluntary standard is not law, so an integrator who adopts one writes it
# as an organization rulebook. The rules below are the statically checkable
# part; the obligations are what URML lists and cannot check.
#
# Pairs with reference/vda5050-runtime for vehicles driven over VDA 5050.
#
# Draft: the format is specified in spec/layer-1-hal/rulebook.md (RFC-0702).

rulebook_version: "0.1"
rulebook_id: FILL_IN
title: "FILL_IN (for example: Building 2 mobile robot rules, from the 2026 risk assessment)"
issuer:
  kind: organization
  name: "FILL_IN (the integrator or the site operator)"
source_status: organization_policy
reviewed: FILL_IN
description: >-
  Operating rules for the mobile robots at one site, taken from the site's
  risk assessment, ISO 3691-4 and the ANSI/A3 R15.08 series. Every value comes
  from the integrator's licensed copy of the standard named in its cite.

rules:
  - id: max_travel_speed
    title: Maximum travel speed a program may request
    cite:
      text: "ISO 3691-4:2023 or ANSI/A3 R15.08-2-2023, clause FILL_IN; the site's risk assessment"
    note: >-
      The highest speed the risk assessment allows in the areas where people
      may be present. A global cap: v0.1 has no zone-scoped caps, so set it to
      the lowest speed any shared area allows. Speed reduction near people,
      personnel detection and braking stay in the robot's safety-rated
      controller.
    cap:
      quantity: speed_m_per_s
      max: FILL_IN

  - id: outside_operating_zones
    title: Programs never send a robot outside its operating zones
    cite:
      text: "ISO 3691-4:2023 or ANSI/A3 R15.08-2-2023, clause FILL_IN; the site layout"
    note: >-
      Name the areas the risk assessment keeps mobile robots out of, such as
      pedestrian-only areas, and declare them in the manifest's
      declared_areas.
    forbid_zone_entry:
      zones: [FILL_IN]

  - id: load_handling_at_stations_only
    title: Loads are picked and placed only at designated stations
    cite:
      text: "ISO 3691-4:2023 or ANSI/A3 R15.08-2-2023, clause FILL_IN; the site's risk assessment"
    note: >-
      Name the travel lanes, crossings and other areas where the risk
      assessment does not allow load handling. pick_from and place_at count
      as grasp and release, so the rule covers them too.
    forbid_primitive:
      primitives: [grasp, release]
      in_zones: [FILL_IN]

  - id: validated_programs_only
    title: Only robot programs covered by the risk assessment run
    cite:
      text: "ANSI/A3 R15.08-2-2023, clause FILL_IN; the site's risk assessment"
    note: >-
      call_program is opaque to URML; over VDA 5050 it runs a vendor action.
      List the programs the risk assessment covered.
    forbid_primitive:
      primitives: [call_program]
      except_names: [FILL_IN]

  - id: safety_outputs_untouched
    title: Programs never write safety-related output lines
    cite:
      text: "ISO 3691-4:2023 or ANSI/A3 R15.08-2-2023, clause FILL_IN; the site's risk assessment"
    note: >-
      Name the output lines the risk assessment marks safety-related, such as
      a door interlock or a muting signal.
    forbid_primitive:
      primitives: [set_output]
      names: [FILL_IN]

obligations:
  - id: risk_assessment
    title: A current risk assessment for the mobile robot system
    text: >-
      The site has a risk assessment that covers every route, station and task
      these programs use, repeated whenever the layout, the fleet or the tasks
      change.
    cite:
      text: "ISO 3691-4:2023 and ANSI/A3 R15.08-2-2023, clauses FILL_IN"

  - id: safety_rated_functions
    title: Personnel detection and stopping in safety-rated control
    text: >-
      Personnel detection, speed control near people, braking and emergency
      stop run in the robot's safety-rated hardware and software, at the
      performance levels the standards require, not in URML and not in the
      fleet manager.
    cite:
      text: "ISO 3691-4:2023 and ANSI/A3 R15.08-1-2020 (R2026), clauses FILL_IN"

  - id: zones_marked_and_declared
    title: Operating and restricted zones are marked on site and match the manifest
    text: >-
      The zones the risk assessment defines are marked on the floor or
      otherwise identified, and the declared_areas in each robot's manifest
      are drawn to match them.
    cite:
      text: "ISO 3691-4:2023 or ANSI/A3 R15.08-2-2023, clause FILL_IN"

  - id: system_validation
    title: The installed system is verified and validated before use
    text: >-
      The integrator verifies and validates the safety functions of the
      installed mobile robot system before the site runs production programs.
    cite:
      text: "ISO 3691-4:2023 or ANSI/A3 R15.08-2-2023, clause FILL_IN"

  - id: users_trained
    title: People who work near the robots are trained and informed
    text: >-
      The site operator trains the people who work with or near the robots,
      keeps the information for use current, and keeps zones clear as the risk
      assessment requires.
    cite:
      text: "ANSI/A3 R15.08-3-2026 or ISO 3691-4:2023, clause FILL_IN"
