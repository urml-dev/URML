# Build + publish the URML packages.
#
# DESIGN: publishing is irreversible and outward-facing, so this workflow
# is NEVER triggered by push/PR. It is manual-dispatch only, and the
# real-PyPI path is gated behind a protected GitHub Environment so it
# cannot fire without an explicit human approval recorded in the repo.
#
#   - target=testpypi (default): build + twine check + upload to TestPyPI.
#     This is the rehearsal; safe to run freely.
#   - target=pypi: the irreversible real publish. Runs in the `pypi-release`
#     environment — configure that Environment with a required reviewer in
#     repo Settings so a second pair of eyes (or a deliberate founder click)
#     is mandatory.
#
# AUTHENTICATION (one-time, founder-side, cannot be done from this repo):
#   - Real PyPI uploads with the PYPI_API_TOKEN repository secret, an
#     account-scoped PyPI token. It can create new projects, so a new
#     package needs no PyPI-side setup; it only waits on PyPI's limit of
#     about 4 new projects a day (see the publish step).
#   - TestPyPI uploads through Trusted Publishing (OIDC). Each project
#     needs a (pending) publisher on test.pypi.org: owner `urml-dev`, repo
#     `URML`, workflow `release.yml`, environment left blank.
#
# Publish order matters (a package must be on the index before its
# dependents resolve). The ordered build list enforces
# validator → bridge/ros2 → platform runtimes/px4 → conformance/mcp-server
# → model. (Each platform runtime depends on validator + ros2-runtime;
# mcp-server on validator + llm-bridge + ros2-runtime; model on validator
# + llm-bridge + conformance.)

name: release

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Where to publish"
        required: true
        default: testpypi
        type: choice
        options:
          - testpypi
          - pypi

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - name: Build all packages (dependency order)
        run: |
          set -eux
          for p in reference/validator \
                   reference/llm-bridge reference/ros2-runtime \
                   reference/ardupilot-runtime reference/autosar-runtime reference/chrono-runtime \
                   reference/av-runtime reference/cobot-runtime reference/edu-runtime \
                   reference/embedded-runtime reference/humanoid-runtime \
                   reference/industrial-arm-runtime reference/isaac-runtime \
                   reference/legged-runtime reference/marine-runtime \
                   reference/mobile-runtime reference/mujoco-runtime \
                   reference/opcua-runtime reference/px4-runtime \
                   reference/vda5050-runtime \
                   conformance reference/mcp-server \
                   reference/model; do
            python -m build --outdir dist "$p"
          done
      - name: Static metadata check (must all PASS)
        run: python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dists
          path: dist/
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-24.04
    # Real PyPI runs in a protected environment; TestPyPI does not.
    environment: ${{ inputs.target == 'pypi' && 'pypi-release' || 'testpypi-release' }}
    permissions:
      id-token: write   # OIDC for Trusted Publishing — no tokens in the repo
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dists
          path: dist/
      # Real PyPI: upload one file at a time and keep going past failures.
      # PyPI lets a personal account create only about 4 NEW projects per day
      # (moving window; "429 Too many new projects created"). ORDER lists
      # packages already on PyPI first, then new ones by priority:
      # urml-ros2-runtime first, because almost every runtime depends on it.
      # Re-running is safe: files already on PyPI are skipped.
      - uses: actions/setup-python@v5
        if: inputs.target == 'pypi'
        with:
          python-version: "3.12"
      - name: Publish to PyPI (per file, skip existing, keep going)
        if: inputs.target == 'pypi'
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          python -m pip install --quiet twine
          ORDER="validator llm_bridge conformance ardupilot_runtime autosar_runtime
                 av_runtime chrono_runtime cobot_runtime edu_runtime embedded_runtime
                 ros2_runtime px4_runtime mcp_server model vda5050_runtime
                 industrial_arm_runtime humanoid_runtime mobile_runtime legged_runtime
                 isaac_runtime mujoco_runtime opcua_runtime marine_runtime"
          files=$(for p in $ORDER; do ls dist/urml_${p}-* 2>/dev/null; done; ls dist/*)
          # A 429 from PyPI is its new-project limit: expected while new names
          # roll out, so it ends the run green with a warning. Any other upload
          # error fails the run.
          limited=""
          failed=""
          for f in $(printf '%s\n' $files | awk '!seen[$0]++'); do
            echo "::group::$f"
            if out=$(python -m twine upload --non-interactive --skip-existing "$f" 2>&1); then
              echo "$out"
            else
              echo "$out"
              if printf '%s' "$out" | grep -q "429 Too Many Requests"; then
                limited="$limited $(basename "$f")"
              else
                failed="$failed $(basename "$f")"
              fi
            fi
            echo "::endgroup::"
          done
          if [ -n "$limited" ]; then
            echo "::warning::Held back by PyPI's new-project limit (about 4 per day). Re-run 24h after the last new project was created:$limited"
            echo "### Held back by PyPI's new-project limit" >> "$GITHUB_STEP_SUMMARY"
            echo "Re-run this workflow 24h after the last new project was created." >> "$GITHUB_STEP_SUMMARY"
            for f in $limited; do echo "- $f" >> "$GITHUB_STEP_SUMMARY"; done
          fi
          if [ -n "$failed" ]; then
            echo "::error::Upload failed for a reason other than the rate limit:$failed"
            echo "### Upload failed" >> "$GITHUB_STEP_SUMMARY"
            for f in $failed; do echo "- $f" >> "$GITHUB_STEP_SUMMARY"; done
            exit 1
          fi
      # TestPyPI: bulk upload through Trusted Publishing (OIDC).
      - name: Publish to TestPyPI (bulk)
        if: inputs.target != 'pypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true
          verbose: true
