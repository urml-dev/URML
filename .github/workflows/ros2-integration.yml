# Gated Linux + ROS 2 integration workflow.
#
# Two jobs, both gated to manual dispatch + weekly cron (never per-push:
# the container pulls + apt installs + sim bringup are slow and the
# coverage doesn't justify the per-PR cost):
#
#   1. rclpy-smoke  — RclpyAdapter loads + operates against a real
#      rclpy (no simulator). Fast, reliable.
#   2. gazebo-e2e   — the real end-to-end: the home/nav_patrol_positive
#      conformance fixture run through ConformanceRunner with a live
#      RclpyAdapter driving a TurtleBot 4 Ignition sim via Nav2. Heavy,
#      best-effort.
#   3. ros2-arm64-build — the Jetson-companion signal: under linux/arm64
#      QEMU, pip-install validator + ros2-runtime + conformance and run
#      the hermetic ros2-runtime suite. RclpyAdapter imports rclpy
#      lazily, so module import works with rclpy absent and the
#      hermetic suite (which fakes rclpy) passes under emulation —
#      proving our pure-Python code runs on a Jetson-class board.
#      CAVEAT: rclpy has no pip/arm64 wheel (it ships with a ROS
#      distro), so this job deliberately does NOT assert a real-rclpy
#      arm64 build — that stays the gated x86 rclpy-smoke lane. Not a
#      hardware-verification claim. Mirrors px4-arm64-build.
#
# HONESTY NOTE ON gazebo-e2e: the sim/Nav2 launch invocations below were
# authored on a Windows box with no ability to run Gazebo. The package
# and launch-file names match TurtleBot 4 / Jazzy documentation but the
# FIRST real run may need a launch-name or arg tweak. That is expected
# and designed for: every diagnostic (ROS logs, gz logs, the pytest
# output) is uploaded as an artifact on `always()`, so a red first run
# tells you exactly what to pin rather than failing opaquely. Do not
# treat the first gazebo-e2e run as a regression signal — treat it as
# the calibration run.

name: ros2-integration

on:
  workflow_dispatch:
  schedule:
    # Mondays 06:00 UTC.
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  rclpy-smoke:
    runs-on: ubuntu-24.04
    container:
      image: ros:jazzy-ros-base
    timeout-minutes: 20
    env:
      # The ROS image auto-loads launch_testing's pytest plugin. Under
      # pytest >= 8 its pytest_pycollect_makemodule hook turns
      # tests/__init__.py into a Package that collects all of tests/, so
      # a module-level importorskip in any sibling file (for example
      # test_nl_partners_capstone.py) skips the whole package and the
      # file we asked for is never collected ("found no collectors",
      # exit 4). Our tests use no ROS pytest plugin, so turn autoload off.
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - uses: actions/checkout@v4

      - name: System deps
        run: |
          apt-get update
          apt-get install -y python3-pip python3-venv python3-yaml

      - name: Install URML packages
        run: |
          . /opt/ros/jazzy/setup.sh
          # The ros:jazzy-ros-base container's system Python carries
          # Debian-managed packages (pytest 7.4.4, pluggy 1.4.0) that have
          # no pip RECORD file, so pip cannot upgrade them even with
          # --break-system-packages (it refuses to uninstall a
          # debian-installed dist-package). Our pyproject requires
          # pytest >= 8, which pulls pluggy >= 1.5 — an upgrade pip can't
          # perform in system site-packages.
          #
          # Fix: an isolated venv created WITH --system-site-packages.
          # ROS's rclpy (in the inherited dist-packages + sourced ROS
          # env) stays importable, but pip installs pytest/pluggy/pydantic
          # into the venv's own site-packages, which takes import
          # precedence — shadowing the Debian versions with zero
          # uninstall. This is the standard pip-on-ROS idiom.
          python3 -m venv --system-site-packages /tmp/ci-venv
          . /tmp/ci-venv/bin/activate
          pip install -U pip
          pip install \
            -e reference/validator \
            -e reference/ros2-runtime \
            -e conformance \
            "pytest>=8"

      - name: Run live integration tests (rclpy smoke only)
        env:
          URML_ROS2_INTEGRATION: "1"
        run: |
          # Source ROS first, then activate the venv so its bin is first
          # on PATH (venv python/pytest preferred) while ROS env vars for
          # rclpy remain set.
          . /opt/ros/jazzy/setup.sh
          . /tmp/ci-venv/bin/activate
          cd reference/ros2-runtime
          python -m pytest tests/integration/test_rclpy_adapter_live.py -v

      - name: Re-run hermetic unit tests under real rclpy
        run: |
          . /opt/ros/jazzy/setup.sh
          . /tmp/ci-venv/bin/activate
          cd reference/ros2-runtime
          python -m pytest tests/test_rclpy_adapter.py -v

  ros2-arm64-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU (arm64 emulation)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Install the stack and run the hermetic suite under linux/arm64
        run: |
          set -eux
          docker run --rm --platform linux/arm64 \
            -v "$PWD":/src -w /src \
            python:3.11-slim-bookworm \
            bash -c '
              set -eux
              apt-get update && apt-get install -y --no-install-recommends gcc python3-dev
              python -m pip install -U pip
              # No rclpy wheel is installed (none exists for arm64);
              # RclpyAdapter imports rclpy lazily, so module import
              # works without it and the hermetic suite fakes rclpy.
              # This proves our pure-Python code on a Jetson-class
              # board, not a real-ROS arm64 build.
              pip install \
                -e reference/validator \
                -e reference/ros2-runtime \
                -e conformance \
                "pytest>=8"
              python -c "import urml_ros2_runtime, urml_ros2_runtime.substrate.rclpy_adapter, platform; print(\"urml_ros2_runtime import OK (rclpy lazy/absent) on\", platform.machine())"
              cd reference/ros2-runtime
              python -m pytest tests/test_rclpy_adapter.py tests/test_mock_adapter.py tests/test_runtime.py tests/test_bindings.py tests/test_conditions.py -q
            '

  gazebo-e2e:
    runs-on: ubuntu-24.04
    # No container: the TurtleBot 4 sim + Gazebo Harmonic stack is
    # easier to apt-install on the bare runner than to find a single
    # prebuilt image that has all of ROS 2 Jazzy + Nav2 + TB4 sim + Gz.
    # The apt install alone has taken 41 minutes on a slow Ubuntu mirror,
    # and a 50-minute cap cancelled a run mid-download (2026-11-24), so
    # leave headroom. The sim wait below can take up to 20 minutes over
    # two launches, and the three-goal drive itself took 42 minutes. The
    # job is cron + manual only, never per-PR.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install ROS 2 Jazzy + TurtleBot 4 sim + Nav2
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y software-properties-common curl gnupg lsb-release
          sudo add-apt-repository universe -y
          curl -sSL https://raw.githubusercontent.com/ros/rosdistro/master/ros.key \
            | sudo gpg --dearmor -o /usr/share/keyrings/ros-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/ros-archive-keyring.gpg] http://packages.ros.org/ros2/ubuntu $(lsb_release -cs) main" \
            | sudo tee /etc/apt/sources.list.d/ros2.list > /dev/null
          # Retry transient mirror failures instead of failing the run.
          echo 'Acquire::Retries "5";' | sudo tee /etc/apt/apt.conf.d/80-retries > /dev/null
          # The runner's sources read their Ubuntu mirror from this list.
          # Its regional EC2 mirror has served ~1 package / 2 s (a 658 MB
          # install did not finish in 90 min on 2026-11-24), so pin the
          # main Ubuntu mirrors instead.
          printf 'http://archive.ubuntu.com/ubuntu/\tpriority:1\nhttp://azure.archive.ubuntu.com/ubuntu/\tpriority:2\n' \
            | sudo tee /etc/apt/apt-mirrors.txt
          sudo apt-get update
          # ros-base + the TB4 sim + nav stack. turtlebot4-simulator pulls
          # Gazebo Harmonic (gz-sim8) and the TB4 description/bringup.
          sudo apt-get install -y \
            ros-jazzy-ros-base \
            ros-jazzy-turtlebot4-simulator \
            ros-jazzy-turtlebot4-navigation \
            ros-jazzy-nav2-bringup \
            ros-jazzy-irobot-create-nodes \
            python3-pip xvfb

      - name: Install URML packages
        run: |
          . /opt/ros/jazzy/setup.sh
          # Pin pytest>=8 explicitly: the ros:jazzy-ros-base container
          # ships a system pytest 7.4.4 in dist-packages. An unpinned
          # `pytest` requirement is treated as already-satisfied by it and
          # NOT upgraded, but our pyproject sets `minversion = "8.0"` —
          # so 7.4.4 hard-errors before collecting anything. The pin
          # forces the upgrade. (gazebo-e2e's bare runner had no
          # preinstalled pytest so it was fine, but pin both for
          # determinism.)
          python3 -m pip install --break-system-packages \
            -e reference/validator \
            -e reference/ros2-runtime \
            -e conformance \
            "pytest>=8"

      - name: Launch TurtleBot 4 Ignition sim + Nav2 (headless)
        run: |
          . /opt/ros/jazzy/setup.sh
          mkdir -p "$HOME/e2e-logs"
          # Headless: software GL under Xvfb so Gazebo's rendering plugin
          # doesn't abort on a GPU-less runner.
          export LIBGL_ALWAYS_SOFTWARE=1
          # `nav2:=true slam:=true` brings up Nav2 with online SLAM so no
          # prebuilt map is needed. On Jazzy the TB4 sim is Gazebo Harmonic
          # and ships as turtlebot4_gz_bringup (turtlebot4_ignition_bringup
          # does not exist there). world:=depot matches the poses in
          # tests/integration/adapter_nav_patrol.yaml. There is no headless
          # arg; the GUI runs under xvfb with software GL.
          #
          # A fixed sleep is not enough. On 2026-11-24 Gazebo had not
          # served the world after 90 s, the controller spawners gave up
          # after their 30 s timeout and exited, nothing published odom,
          # and Nav2 never activated; the test's first goal was rejected.
          # So wait until bt_navigator is active, and relaunch once if a
          # spawner died (the second launch also finds the world's models
          # already in the Fuel cache).
          launch_sim() {
            setsid nohup xvfb-run -a ros2 launch turtlebot4_gz_bringup turtlebot4_gz.launch.py \
              nav2:=true slam:=true rviz:=false world:=depot \
              > "$HOME/e2e-logs/sim-attempt-$1.log" 2>&1 &
            echo $! > "$HOME/e2e-logs/sim.pid"
          }
          stop_sim() {
            kill -TERM -- "-$(cat "$HOME/e2e-logs/sim.pid")" 2>/dev/null || true
            sleep 15
            pkill -9 -f 'gz sim' 2>/dev/null || true
            pkill -9 -f '/opt/ros/jazzy/lib/' 2>/dev/null || true
            sleep 5
          }
          for attempt in 1 2; do
            log="$HOME/e2e-logs/sim-attempt-$attempt.log"
            launch_sim "$attempt"
            deadline=$((SECONDS + 600))
            while [ "$SECONDS" -lt "$deadline" ]; do
              if ros2 lifecycle get /bt_navigator 2>/dev/null | grep -q '^active'; then
                echo "Nav2 active on attempt $attempt after ${SECONDS}s"
                exit 0
              fi
              if grep -q 'spawner.*process has died' "$log"; then
                echo "::warning::A controller spawner died on attempt $attempt; relaunching."
                break
              fi
              sleep 10
            done
            echo "Nav2 not active on attempt $attempt."
            stop_sim
          done
          echo "::error::Nav2 never became active after two sim launches."
          exit 1

      - name: Run the Gazebo end-to-end conformance test
        env:
          URML_GAZEBO_E2E: "1"
          # Same launch_testing collection bug as rclpy-smoke: without
          # this, pytest collects nothing and exits 4.
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        # pipefail: without it the `| tee` below hides pytest's exit code
        # and a run that collected or passed nothing still shows green.
        shell: bash -eo pipefail {0}
        run: |
          . /opt/ros/jazzy/setup.sh
          cd reference/ros2-runtime
          python3 -m pytest tests/integration/test_nav_patrol_gazebo_e2e.py -v \
            | tee "$HOME/e2e-logs/pytest.log"

      - name: Collect diagnostics
        if: always()
        run: |
          set +e
          # Each step is a fresh shell: load ROS or `ros2` is not found.
          . /opt/ros/jazzy/setup.sh
          cp -r "$HOME/.ros/log" "$HOME/e2e-logs/ros-log" 2>/dev/null || true
          ros2 node list > "$HOME/e2e-logs/node-list.txt" 2>&1 || true
          ros2 action list > "$HOME/e2e-logs/action-list.txt" 2>&1 || true
          ros2 lifecycle get /bt_navigator > "$HOME/e2e-logs/bt-navigator-state.txt" 2>&1 || true
          # Gazebo's own logs, and what it fetched from Fuel, to tell a
          # slow model download from a slow server start.
          cp -r "$HOME/.gz/sim/log" "$HOME/e2e-logs/gz-log" 2>/dev/null || true
          { du -sh "$HOME/.gz/fuel"; find "$HOME/.gz/fuel" -maxdepth 4 -type d; } \
            > "$HOME/e2e-logs/gz-fuel-cache.txt" 2>&1 || true

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gazebo-e2e-diagnostics
          path: ~/e2e-logs
          retention-days: 14
