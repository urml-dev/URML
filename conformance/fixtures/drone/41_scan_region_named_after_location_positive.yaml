name: drone/scan_region_named_after_location_positive
description: >
  Positive twin of scan_undeclared_region_rejected. `roof_north` is a declared
  location at (10, 5), so the region resolves and is judged at that point,
  which lies inside the (-5,-5) to (15,15) geofence. Accepted and executed.
  What the aircraft covers around the point is a path, which the runtime
  keeps inside the envelope.

manifest: drone_civilian
envelope: drone_with_geofence
profiles: [drone]

program:
  profile: drone
  behavior:
    type: sequence
    on_error: abort_and_report
    steps:
      - scan:
          area:
            named_region: roof_north
          altitude: 30.0
          sensor: downward
          store_as: survey

expected_validation:
  accepted: true

expected_execution:
  success: true
  steps_executed: 1
  audit_methods:
    - run_scan
